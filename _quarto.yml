project:
  type: book
  output-dir: _site
  resources:
    - materials/**
    - homeworks/hw1.pdf
    - homeworks/hw2.pdf
    - homeworks/hw1-solutions.pdf
    - homeworks/hw1-practice.pdf
    - "!private/**"

book:
  title: "Data Analytics for AI"
  subtitle: "Executive M.Tech · Monsoon 2026"
  author: "Soma S Dhavala · IIT Jammu"
  reader-mode: true
  sidebar:
    collapse-level: 1
  page-footer:
    left: "Data Analytics for AI · Executive M.Tech · Monsoon 2026 · IIT Jammu"
    right: 'Built with <a href="https://quarto.org/">Quarto</a>.'
  site-url: https://acads-iit-jammu.github.io/da-f26-mtech
  repo-url: https://github.com/acads-iit-jammu/da-f26-mtech
  repo-branch: main
  chapters:
    - index.qmd
    - course.qmd
    - syllabus.qmd
    - curriculum.qmd
    - assignments.qmd
    - modules.qmd
    - part: "01 · Fundamentals of Probability and Random Signal Theory"
      chapters:
        - tutorials/01-probability-foundations.qmd
        - tutorials/02-random-variables.qmd
        - tutorials/02-joint-distributions-tutorial.qmd
        - tutorials/04-meeting-problem.qmd
        - tutorials/05-expectation-variance.qmd
        - tutorials/06-transformations.qmd
        - tutorials/07-multivariate-normal.qmd
    - part: "Supplementary Material"
      chapters:
        - tutorials/01-probability-supplement.qmd
        - tutorials/02-random-variables-supplement.qmd
        - tutorials/05-expectation-supplement.qmd
        - tutorials/06-transformations-supplement.qmd
        - tutorials/07-normal-supplement.qmd
    - resources.qmd

format:
  html:
    theme:
      - cosmo
      - iitjammu.scss
    callout-appearance: simple
    number-sections: false
    link-external-newwindow: true

editor: source
