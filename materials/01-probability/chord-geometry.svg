<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="title desc"><title id="title">The perpendicular bisector of a chord</title><desc id="desc">The radius R, half chord length L over 2, and perpendicular distance D form a right triangle. L squared over four plus D squared equals R squared.</desc><g transform="translate(160 140)"><circle r="124" fill="none" stroke="#8da4bb" stroke-width="2"/><path d="M-113.23,-50 L113.23,-50" stroke="#006d77" stroke-width="4"/><path d="M0,0 L0,-50 L113.23,-50 Z" fill="#eaf3ff" stroke="#003f87" stroke-width="2"/><path d="M0,-40 L10,-40 L10,-50" fill="none" stroke="#172d43"/><circle r="3" fill="#172d43"/><g font-family="Georgia,serif" font-size="23" fill="#172d43"><text x="-27" y="-19">D</text><text x="47" y="-63">L/2</text><text x="66" y="-8">R</text></g></g><g font-family="system-ui,sans-serif" font-size="23" fill="#172d43"><text x="330" y="118">(L/2)² + D² = R²</text><text x="330" y="166">Long ⇔ D &lt; R/2</text></g></svg>
