<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" role="img" aria-labelledby="title desc"><title id="title">A chord and an inscribed equilateral triangle</title><desc id="desc">A circle of radius R contains an equilateral triangle, whose side length is square root of three times R. A different chord is shown for comparison.</desc><g transform="translate(190 145)"><circle r="126" fill="none" stroke="#003f87" stroke-width="3"/><path d="M0,-126 L109.12,63 L-109.12,63 Z" fill="#eaf3ff" stroke="#003f87" stroke-width="2.5"/><path d="M-122,-31 L122,-31" stroke="#ad4a26" stroke-width="4"/><circle r="3" fill="#172d43"/><path d="M0,0 L0,-126" stroke="#50657b" stroke-width="2" stroke-dasharray="5 5"/><text x="12" y="-68" font-family="Georgia,serif" font-size="24" fill="#172d43">R</text></g><g font-family="system-ui,sans-serif" font-size="25" fill="#172d43"><text x="375" y="98">Triangle side = √3 R</text><text x="375" y="154" fill="#ad4a26">Chord length = L</text><text x="375" y="220">What is P(L &gt; √3 R)?</text></g></svg>
